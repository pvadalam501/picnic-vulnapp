stages:
  - build
  - deploy

variables:
  GAR_LOCATION: "us-central1"               # Update to your Artifact Registry region
  GAR_REPOSITORY: "picnic-repo"            # Update to your GAR repository name
  IMAGE_NAME: "picnic-vulnapp"
  IMAGE_TAG: "$GAR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA"

# --- STAGE 1: Build & Push Docker Image ---
build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache python3 curl bash
    # Install Google Cloud SDK
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt
    - export PATH=$PATH:/opt/google-cloud-sdk/bin
    # Authenticate to GCP using Service Account Key
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev --quiet
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - main

# --- STAGE 2: Deploy to GKE ---
deploy_to_gke:
  stage: deploy
  image: google/cloud-sdk:latest
  before_script:
    # Install gke-gcloud-auth-plugin and kubectl
    - gcloud components install gke-gcloud-auth-plugin kubectl --quiet
    # Authenticate to GCP
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT_ID
    # Fetch GKE Cluster Credentials
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone $GKE_ZONE --project $GCP_PROJECT_ID
  script:
    # Replace placeholder with actual Docker Image URI built in previous stage
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|g" k8s/deployment.yaml
    # Apply Kubernetes manifests
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    # Verify deployment rollout
    - kubectl rollout status deployment/picnic-vulnapp --timeout=120s
    - kubectl get svc picnic-vulnapp-service
  only:
    - main
